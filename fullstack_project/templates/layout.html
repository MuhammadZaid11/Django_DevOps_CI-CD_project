{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My App{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-dark text-light">
  <nav class="navbar navbar-dark bg-primary sticky-top">
  <a class="navbar-brand" href="#">tweet-App</a>

  <ul class="nav justify-content-center">
  <li class="nav-item">
    <a class="nav-link active text-dark" href="#">Home</a>
  </li>
  <li class="nav-item">
    <a class="nav-link text-dark" href="#">tweets</a>
  </li>
  <li class="nav-item">
    <a class="nav-link text-dark" href="#">Feed</a>
  </li>
    <li class="nav-item">
    <a class="nav-link text-dark" href="#">Profile</a>
  </li>

</ul>
<div class="d-grid gap-2 d-md-flex justify-content-md-end">
  <button class="btn btn-warning me-md-2" type="button">Login</button>
  <button class="btn btn-success" type="button">Sign Up</button>
</div>
</nav>

    <div class="container">
        {% block content %}
        {% endblock %}
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2JDl5s5n00R6a02uacKxPb0td3y6X1ZC8tIC7XLn0Ev02lH2w5rM02a94Sg" crossorigin="anonymous"></script>
</body>
</html>
