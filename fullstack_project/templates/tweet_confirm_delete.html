{% extends 'base.html' %}

{% block title %}Delete Tweet - TweetApp{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card mt-5">
                <div class="card-body p-4">
                    <h2 class="card-title mb-4 text-danger">
                        <i class="bi bi-exclamation-triangle"></i> Delete Tweet?
                    </h2>

                    <p class="lead mb-4">
                        Are you sure you want to delete this tweet? This action cannot be undone.
                    </p>

                    <!-- Preview of Tweet to Delete -->
                    <div class="card bg-light mb-4">
                        <div class="card-body">
                            <p class="text-dark mb-0">{{ tweet.text }}</p>
                            {% if tweet.photo %}
                            <div class="mt-3">
                                <img src="{{ tweet.photo.url }}" alt="Tweet photo" class="img-fluid rounded" style="max-height: 200px;">
                            </div>
                            {% endif %}
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <form method="POST" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Yes, Delete Tweet
                        </button>
                        <a href="{% url 'tweet_list' %}" class="btn btn-secondary">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
